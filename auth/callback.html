<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Signing in | Melody</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --cream: #FAF8F4;
      --ink: #1A1814;
      --mid: #6B6760;
      --accent: #8A7E72;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.7;
    }
    main {
      width: min(560px, calc(100% - 48px));
      text-align: center;
    }
    .brand {
      font-family: var(--serif);
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 26px;
    }
    h1 {
      margin: 0 0 14px;
      font-family: var(--serif);
      font-weight: 300;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.1;
    }
    p {
      margin: 0;
      color: var(--mid);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand">Melody</p>
    <h1>Completing sign-in</h1>
    <p id="status">Checking your employee access.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth.js"></script>
  <script>
    const status = document.getElementById('status');

    async function completeSignIn() {
      const { data, error } = await melodyAuth.auth.getSession();

      if (error || !data.session) {
        window.location.replace('../employee-login.html?status=auth_error');
        return;
      }

      if (!isMelodyEmployee(data.session)) {
        status.textContent = 'This Google account is not authorised for Melody employee access.';
        await melodyAuth.auth.signOut();
        window.location.replace('../employee-login.html?status=unauthorized');
        return;
      }

      window.location.replace('../apps.html');
    }

    completeSignIn();
  </script>
</body>
</html>
