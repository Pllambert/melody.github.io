<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ARIA | Melody</title>
  <link rel="stylesheet" href="app-status.css" />
</head>
<body data-auth-pending="true">
  <nav>
    <a href="index.html" class="nav-logo">Melody</a>
    <div class="nav-links">
      <a href="apps.html" class="nav-link">Apps</a>
      <button class="nav-link" id="sign-out-btn" type="button">Sign out</button>
    </div>
  </nav>

  <main>
    <section>
      <p class="section-label">Investment Intelligence</p>
      <h1>ARIA is almost <em>ready</em></h1>
      <p class="intro">
        ARIA will help Melody identify acquisition targets, organise diligence, and convert findings into a clear takeover thesis.
      </p>
    </section>

    <aside class="status-card" aria-labelledby="status-title">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l6-6 4 4 8-8" />
          <path d="M14 7h7v7" />
          <circle cx="8" cy="18" r="2" />
        </svg>
      </div>
      <h2 id="status-title">Coming soon</h2>
      <p>
        The ARIA workspace is being prepared for approved Melody employees.
      </p>
      <p class="destination">aria.melodyvc.com</p>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    async function guardAppStatusPage() {
      const { data } = await melodyAuth.auth.getSession();

      if (!data.session) {
        window.location.replace('employee-login.html');
        return;
      }

      if (!isMelodyEmployee(data.session)) {
        await melodyAuth.auth.signOut();
        window.location.replace('employee-login.html?status=unauthorized');
        return;
      }

      document.body.removeAttribute('data-auth-pending');
    }

    document.getElementById('sign-out-btn').addEventListener('click', async () => {
      await melodyAuth.auth.signOut();
      window.location.replace('employee-login.html?status=signed_out');
    });

    guardAppStatusPage();
  </script>
</body>
</html>
